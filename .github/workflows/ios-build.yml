
name: Build Pomme iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          brew install xcodegen cmake just

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build iOS archive
        run: |
          python3 tools/ios.py archive

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Pomme-iOS
          path: target/ios-build/export/*.ipa
